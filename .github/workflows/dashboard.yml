name: dashboard

on:
  schedule:
    - cron: "47 22 * * 0-4"   # 22:47 UTC = 06:47 Singapore/Hong Kong next morning, after the US close (17:00 New York in both summer and winter time)
    - cron: "30 0 * * 1-5"    # kept as a second run, once FRED has published more
  workflow_dispatch:          # lets you run it by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - name: Build the page
        run: python -m scripts.morning_snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Encrypt the page
        run: npx --yes staticrypt@3 site/index.html -p "$PAGE_PASSWORD" --short -d encrypted
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: encrypted

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4